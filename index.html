<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vim Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a2e;
  --surface: #1f1f38;
  --text: #e0def4;
  --muted: #908caa;
  --faint: #6e6a86;
  --accent: #c4a7e7;
  --correct: #9ccfd8;
  --warn: #f6c177;
  --incorrect: #eb6f92;
  --cursor-bg: #e0def4;
  --cursor-fg: #1a1a2e;
  --line-num: #3e3a56;
  --visual: rgba(196, 167, 231, 0.22);
  --font-serif: 'Crimson Pro', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--font-serif); font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
#app { height: 100vh; display: flex; flex-direction: column; }
.screen { display: none; flex-direction: column; height: 100%; opacity: 0; transition: opacity .2s ease-out; }
.screen.active { display: flex; opacity: 1; }

/* ── Terminal Start ───────────────────── */
#screen-start { align-items: center; justify-content: center; gap: 0; font-family: var(--font-mono); }
.term-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 480px; width: 100%; }
.term-logo { text-align: center; }
.term-logo h1 { font-family: var(--font-mono); font-weight: 700; font-size: 2.2rem; letter-spacing: .12em; color: var(--text); }
.term-logo .term-tagline { font-family: var(--font-serif); font-size: .9rem; color: var(--muted); font-style: italic; font-weight: 300; margin-top: 2px; }
.term-menu { display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 320px; }
.term-item {
  display: flex; align-items: center; gap: 10px; padding: 5px 16px;
  font-size: .82rem; color: var(--muted); cursor: pointer; transition: color .1s, background .1s;
  border-left: 2px solid transparent;
}
.term-item:hover { color: var(--text); background: rgba(196,167,231,0.06); border-left-color: var(--faint); }
.term-key { color: var(--accent); min-width: 22px; text-align: center; font-size: .72rem; }
.term-label { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; padding: 8px 16px 2px; }
.term-sub { padding-left: 38px; }
.term-back { font-size: .68rem; color: var(--faint); padding: 4px 16px; margin-top: 2px; }
.term-tip { font-size: .7rem; color: var(--faint); font-style: italic; text-align: center; max-width: 360px; line-height: 1.5; }
.term-footer { display: flex; gap: 24px; align-items: center; justify-content: center; }
.streak-display { font-family: var(--font-mono); font-size: .72rem; color: var(--faint); }

/* ── Help Overlay ─────────────────────── */
#help-overlay {
  position: fixed; inset: 0; background: rgba(26,26,46,0.92); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); animation: fadeIn .15s ease-out;
}
#help-overlay.hidden { display: none; }
.help-box { max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px 32px; }
.help-title { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; letter-spacing: .05em; }
.help-section { margin-bottom: 16px; }
.help-heading { font-size: .7rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; border-bottom: 1px solid var(--surface); padding-bottom: 4px; }
.help-row { display: flex; gap: 12px; font-size: .75rem; color: var(--muted); padding: 2px 0; }
.help-row .hk { color: var(--accent); min-width: 60px; text-align: right; }
.help-close { font-size: .68rem; color: var(--faint); text-align: center; margin-top: 12px; }

/* ── Game ──────────────────────────────── */
#screen-game { padding: 8px 20px; gap: 4px; position: relative; }
#game-header {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .8rem; color: var(--muted); min-height: 28px; flex-shrink: 0;
}
#game-info { display: flex; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: .8rem; color: var(--faint); }
#problem-desc { font-size: .95rem; color: var(--text); line-height: 1.4; flex-shrink: 0; min-height: 22px; transition: opacity .15s ease-out; }
.editor-container { flex: 1; display: flex; gap: 2px; min-height: 0; overflow: hidden; }
.editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.editor-label { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; padding: 2px 0; flex-shrink: 0; }
.editor-divider { width: 1px; background: var(--surface); flex-shrink: 0; margin: 16px 6px; }
.editor {
  flex: 1; overflow: auto; font-family: var(--font-mono); font-size: .78rem;
  line-height: 1.65; white-space: pre; padding: 4px 0;
}
.editor-line { display: block; padding: 0 8px 0 0; }
.line-num { display: inline-block; width: 2.5ch; text-align: right; color: var(--line-num); margin-right: 1ch; user-select: none; font-size: .72rem; }
.char-cursor { background: var(--cursor-bg); color: var(--cursor-fg); animation: cursorBlink 1s step-end infinite; }
.char-visual { background: var(--visual); }
.char-target-cursor { outline: 2px solid var(--accent); outline-offset: -1px; }
.syn-kw { color: #c4a7e7; } .syn-str { color: #f6c177; }
.syn-comment { color: var(--faint); font-style: italic; } .syn-num { color: #9ccfd8; }
.syn-type { color: #9ccfd8; } .syn-func { color: #eb6f92; }
.syn-op { color: #e0def4; font-weight: bold; } .syn-preproc { color: #c4a7e7; font-style: italic; }
.syn-bool { color: #eb6f92; } .syn-ns { color: #9ccfd8; }
.replay-overlay { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; padding: 12px; background: rgba(25, 23, 36, 0.95); border-top: 1px solid var(--surface); }
.replay-bar { font-family: var(--font-mono); font-size: 14px; color: var(--text); margin-bottom: 6px; }
.replay-key { color: var(--accent); } .replay-key-current { color: var(--correct); font-weight: bold; }
.replay-counter { color: var(--faint); margin-left: 8px; }
.replay-hint { font-size: 12px; color: var(--faint); }
.target-editor { opacity: .5; }
.target-line-diff { border-left: 2px solid var(--accent); padding-left: 4px; opacity: 1; }

/* ── Status & Hints ────────────────────── */
#status-bar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 24px; }
#mode-indicator {
  font-family: var(--font-mono); font-size: .65rem; font-weight: 700;
  letter-spacing: .06em; padding: 1px 8px; color: var(--bg); background: var(--accent); text-transform: uppercase;
  transition: background .15s ease-out;
}
#mode-indicator.insert { background: var(--correct); }
#mode-indicator.visual { background: var(--warn); }
#mode-indicator.command { background: var(--muted); }
#keystroke-bar { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; align-items: center; }
.key-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; padding: 0 4px; background: var(--surface);
  font-family: var(--font-mono); font-size: .65rem; color: var(--muted);
}
#mode-hints {
  font-family: var(--font-mono); font-size: .6rem; color: var(--faint);
  flex-shrink: 0; min-height: 16px; letter-spacing: .02em; opacity: .7;
  transition: opacity .15s ease-out;
}

/* ── Command Overlay ───────────────────── */
#command-overlay {
  position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, 50%);
  background: var(--surface); border: 1px solid var(--faint);
  padding: 10px 28px; font-family: var(--font-mono); font-size: 1rem;
  color: var(--text); z-index: 100; min-width: 320px; text-align: center;
}
#command-overlay .cmd-prefix { color: var(--accent); margin-right: 2px; }
#command-overlay .cmd-cursor { color: var(--accent); animation: blink 1s step-end infinite; }

/* ── Inline Feedback ───────────────────── */
#inline-feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--bg); border: 1px solid var(--surface);
  padding: 20px 40px; z-index: 90; text-align: center;
  animation: feedIn .2s ease-out;
}
.feed-badge { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
.feed-badge.optimal { color: var(--correct); animation: pulseGlow .4s ease-out; }
.feed-badge.close { color: var(--warn); }
.feed-badge.inefficient { color: var(--incorrect); }
.feed-stats { display: flex; gap: 24px; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); justify-content: center; margin-bottom: 10px; }
.feed-stat-val { font-size: 1.1rem; color: var(--text); font-weight: 500; display: block; }
.feed-keys { display: flex; gap: 20px; justify-content: center; }
.feed-keys-col { text-align: center; }
.feed-keys-label { font-size: .65rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; font-family: var(--font-serif); }
.feed-keys-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.feed-auto { font-size: .7rem; color: var(--faint); font-style: italic; margin-top: 8px; font-family: var(--font-serif); }

/* ── Results ───────────────────────────── */
#screen-results { align-items: center; justify-content: center; gap: 24px; overflow-y: auto; padding: 24px; }
.results-title { font-weight: 300; font-size: 1.8rem; }
.results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; width: 100%; max-width: 480px; }
.results-stat-label { font-size: .7rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.results-stat-val { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 500; }
.results-categories { width: 100%; max-width: 480px; }
.results-cat-title { font-size: .72rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.results-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.results-cat-name { font-size: .78rem; color: var(--muted); width: 80px; text-align: right; }
.results-cat-bar-bg { flex: 1; height: 5px; background: var(--surface); }
.results-cat-bar-fill { height: 100%; background: var(--accent); transition: width .4s; }
.results-cat-pct { font-family: var(--font-mono); font-size: .68rem; color: var(--faint); width: 36px; }
.results-worst { font-size: .85rem; color: var(--muted); font-style: italic; text-align: center; }
.results-worst strong { color: var(--warn); font-weight: 500; }
.results-actions { display: flex; gap: 16px; }
.results-hints { font-family: var(--font-mono); font-size: .65rem; color: var(--faint); text-align: center; }
.btn-primary {
  background: none; border: 1px solid var(--faint); font-family: var(--font-serif);
  font-size: .85rem; color: var(--text); padding: 6px 24px; cursor: pointer; transition: border-color .15s, color .15s;
}
.btn-primary:hover { border-color: var(--accent); color: var(--accent); }

/* ── Stats ─────────────────────────────── */
#screen-stats { padding: 24px; gap: 16px; overflow-y: auto; }
.stats-header { display: flex; justify-content: space-between; align-items: baseline; }
.stats-title { font-weight: 300; font-size: 1.6rem; }
.stats-section { margin-bottom: 8px; }
.stats-section-title { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
.stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
.stats-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; text-align: center; }
.stat-block { padding: 8px 4px; }
.stat-val { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 500; }
.stat-label { font-size: .6rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.stat-val-sm { font-family: var(--font-mono); font-size: .85rem; font-weight: 500; }
.stats-graph { width: 100%; max-width: 520px; }
.stats-graph svg { width: 100%; height: auto; }
.stats-bests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: .72rem; }
.stats-best-cell { background: var(--surface); padding: 8px; text-align: center; }
.stats-best-cell .sbc-mode { color: var(--muted); font-family: var(--font-mono); font-size: .65rem; margin-bottom: 4px; }
.stats-best-cell .sbc-val { font-family: var(--font-mono); color: var(--text); font-size: .9rem; }
.stats-best-cell .sbc-date { color: var(--faint); font-size: .58rem; margin-top: 2px; }
.stats-best-cell.empty .sbc-val { color: var(--faint); }
.stats-heatmap { }
.stats-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: .72rem; }
.stats-cat-name { color: var(--muted); width: 80px; text-align: right; font-family: var(--font-mono); }
.stats-cat-bar { flex: 1; height: 6px; background: var(--surface); }
.stats-cat-fill { height: 100%; background: var(--accent); transition: width .3s ease-out; }
.stats-cat-pct { font-family: var(--font-mono); color: var(--faint); width: 32px; font-size: .65rem; }
.stats-cat-meta { font-family: var(--font-mono); color: var(--faint); width: 80px; font-size: .58rem; text-align: right; }
.stats-sessions-table { font-size: .7rem; width: 100%; }
.stats-sessions-table .st-header { display: flex; color: var(--faint); font-family: var(--font-mono); font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; padding: 4px 0; border-bottom: 1px solid var(--surface); }
.stats-sessions-table .st-row { display: flex; color: var(--muted); font-family: var(--font-mono); padding: 3px 0; border-bottom: 1px solid rgba(31,31,56,0.5); }
.stats-sessions-table .st-row:nth-child(even) { background: rgba(31,31,56,0.3); }
.stats-sessions-table .st-cell { flex: 1; text-align: center; }
.stats-sessions-table .st-cell:first-child { text-align: left; }
.stats-hints { font-family: var(--font-mono); font-size: .62rem; color: var(--faint); }
.no-data { color: var(--faint); font-style: italic; font-size: .8rem; }
.link-btn {
  background: none; border: none; font-family: var(--font-serif); font-size: .85rem;
  color: var(--faint); cursor: pointer; font-style: italic; transition: color .15s;
}
.link-btn:hover { color: var(--muted); }

.target-line-added { border-left: 2px solid var(--correct); padding-left: 4px; opacity: 1; }
.search-match { background: rgba(246, 193, 119, 0.3); }
.sub-old { background: rgba(235, 111, 146, 0.3); text-decoration: line-through; text-decoration-color: #eb6f92; }
.sub-new { background: rgba(156, 207, 216, 0.3); color: #9ccfd8; }
.font-size-controls { position: fixed; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 50; }
.font-size-btn { background: var(--surface); border: 1px solid var(--faint); color: var(--muted); font-family: var(--font-mono); font-size: .7rem; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
.font-size-btn:hover { color: var(--accent); border-color: var(--accent); }
.difficulty-badge { font-family: var(--font-mono); font-size: .65rem; color: var(--faint); }
.difficulty-badge .d-active { color: var(--warn); }
.hidden { display: none !important; }

/* ── Animations ───────────────────────── */
.fade-in { animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes feedIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.95); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes pulseGlow {
  0% { text-shadow: 0 0 0 transparent; transform: scale(1); }
  50% { text-shadow: 0 0 12px var(--correct); transform: scale(1.05); }
  100% { text-shadow: 0 0 0 transparent; transform: scale(1); }
}
</style>
</head>
<body>
<div id="app">
  <div class="font-size-controls">
    <button class="font-size-btn" id="btn-font-down" title="Decrease font size (Ctrl--)">−</button>
    <button class="font-size-btn" id="btn-font-up" title="Increase font size (Ctrl-+)">+</button>
  </div>
  <div id="screen-start" class="screen active">
    <div class="term-wrap">
      <div class="term-logo">
        <h1>vim golf</h1>
        <div class="term-tagline">train your keystrokes</div>
      </div>
      <div class="term-menu" id="term-menu"></div>
      <div class="term-tip" id="term-tip"></div>
      <div class="term-footer">
        <span class="streak-display" id="streak-display"></span>
      </div>
    </div>
    <div id="help-overlay" class="hidden"></div>
  </div>

  <div id="screen-game" class="screen">
    <div id="game-header">
      <span id="game-mode-label"></span>
      <span id="game-info">
        <span id="game-difficulty" class="difficulty-badge"></span>
        <span id="game-timer"></span>
        <span id="game-counter"></span>
        <button class="link-btn" id="btn-quit">end</button>
      </span>
    </div>
    <p id="problem-desc"></p>
    <div class="editor-container">
      <div class="editor-pane">
        <div class="editor-label">Buffer</div>
        <div class="editor" id="editor"></div>
      </div>
      <div class="editor-divider"></div>
      <div class="editor-pane">
        <div class="editor-label">Target</div>
        <div class="editor target-editor" id="target-editor"></div>
      </div>
    </div>
    <div id="status-bar">
      <span id="mode-indicator">NORMAL</span>
      <div id="keystroke-bar"></div>
    </div>
    <div id="mode-hints"></div>
    <div id="command-overlay" class="hidden">
      <span class="cmd-prefix">:</span><span id="command-text"></span><span class="cmd-cursor">_</span>
    </div>
    <div id="inline-feedback" class="hidden"></div>
  </div>

  <div id="screen-results" class="screen"></div>
  <div id="screen-stats" class="screen"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
