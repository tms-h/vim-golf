      target[row] = line.slice(0, col) + line.slice(col + word.length);
      return {
        initialBuffer: lines, cursorPos: { row, col },
        targetBuffer: target,
        description: `Visually select "${word}" and delete it`,
        optimalKeystrokes: ['v', 'e', 'd'],
        category: 'visual', difficulty: 2
      };
    }
  }

  // ── Compound Generators ─────────────────────────────────

  _genCompound(difficulty) {
    const variant = this._randInt(0, 4);

    if (variant === 0) {
      const lines = this._simpleLines();
      const row = this._randInt(0, lines.length - 1);
      const line = lines[row];
      const col = this._randInt(0, Math.max(0, line.length - 1));
      const ch = line[col];
      const chars = 'abcdefghijlmnopqrstuvwxyz0123456789';
      const newCh = chars[this._randInt(0, chars.length - 1)];
      const target = [...lines];
      target[row] = line.slice(0, col) + newCh + line.slice(col + 1);
      return {
        initialBuffer: lines, cursorPos: { row, col },
        targetBuffer: target,
        description: `Replace the character "${ch}" with "${newCh}"`,
        optimalKeystrokes: ['r', newCh],
        category: 'compound', difficulty: 1
      };
    }

    if (variant === 1) {
      const lines = this._simpleLines();
      if (lines.length < 2) return null;
      const row = this._randInt(0, lines.length - 2);
      const target = [...lines];
      const curLine = target[row];
      const nextLine = target[row + 1].trimStart();
      target[row] = curLine + (nextLine ? ' ' + nextLine : '');
      target.splice(row + 1, 1);
      return {
        initialBuffer: lines, cursorPos: { row, col: 0 },
        targetBuffer: target,
        description: `Join the current line with the line below`,
        optimalKeystrokes: ['J'],
        category: 'compound', difficulty: 1
      };
    }

    if (variant === 2) {
      const v = this._pick(this.varNames);
      const oldWord = this._pick(this.strLiterals);
      const newWord = this._pick(this.strLiterals.filter(s => s !== oldWord));
      const line = `const ${v} = "${oldWord}" + "${oldWord}";`;
      const target = [line.split(oldWord).join(newWord)];
      return {
        initialBuffer: [line], cursorPos: { row: 0, col: 0 },
        targetBuffer: target,
        description: `Replace all "${oldWord}" with "${newWord}" on this line`,
        optimalKeystrokes: [';', ...'s/'.split(''), ...oldWord.split(''), '/', ...newWord.split(''), '/', 'g', 'Enter'],
        category: 'compound', difficulty: 2
      };
    }

    if (variant === 3) {
      const lines = this._getSnippet();
      if (lines.length < 2) return null;
      const row = this._randInt(0, lines.length - 1);
      const target = [...lines];
      target[row] = lines[row].replace(/^  /, '');
      if (target[row] === lines[row]) return null;
      return {
        initialBuffer: lines, cursorPos: { row, col: 0 },
        targetBuffer: target,
        description: `Dedent the current line`,
        optimalKeystrokes: ['<', '<'],
        category: 'compound', difficulty: 1
      };
    }

    {
      const lines = this._simpleLines();
      if (lines.length < 2) return null;
      const row = 0;
      const line = lines[row];
      const target = [...lines];
      target.splice(row, 2);
      if (target.length === 0) return null;
      return {
        initialBuffer: lines, cursorPos: { row: 0, col: 0 },
        targetBuffer: target,
        description: `Delete two lines using dd and dot repeat`,
        optimalKeystrokes: ['d', 'd', '.'],
        category: 'compound', difficulty: 2
      };
    }
  }

  _fallback(category) {
    const line = `const value = "hello";`;
    return {
      initialBuffer: [line],
      cursorPos: { row: 0, col: 6 },
      targetBuffer: [`const  = "hello";`],
      description: `Delete the word "value"`,
      optimalKeystrokes: ['d', 'i', 'w'],
      category: category || 'deletion',
      difficulty: 1
    };
  }
}

// ══════════════════════════════════════════════════════════════
// STATS MANAGER
// ══════════════════════════════════════════════════════════════

class StatsManager {
  constructor() {
    this.data = this._load();
  }

  _load() {
    try {
      const raw = localStorage.getItem('vim-golf:data');
      if (raw) {
        const d = JSON.parse(raw);
        if (d.version === 1) return d;
      }
    } catch (e) {}
    return {
      version: 1,
      sessions: [],
      categoryStats: {},
      streak: { current: 0, best: 0, lastDate: null },
      settings: { preferredMode: null }
    };
  }

  save() {
    try {
      localStorage.setItem('vim-golf:data', JSON.stringify(this.data));
    } catch (e) {}
  }

  recordProblem(result) {
    const cat = result.category;
    if (!this.data.categoryStats[cat]) {
      this.data.categoryStats[cat] = { attempts: 0, optimalCount: 0, totalKeystrokes: 0, totalOptimal: 0 };
    }
    const cs = this.data.categoryStats[cat];
    cs.attempts++;
    cs.totalKeystrokes += result.keystrokes;
    cs.totalOptimal += result.optimal;
    if (result.keystrokes <= result.optimal) cs.optimalCount++;
  }

  endSession(session) {
    this.data.sessions.push(session);
    if (this.data.sessions.length > 100) this.data.sessions = this.data.sessions.slice(-100);
    this._updateStreak();
    this.save();
  }

  _updateStreak() {
    const today = new Date().toISOString().slice(0, 10);
    const last = this.data.streak.lastDate;
    if (last === today) return;

    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (last === yesterday) {
      this.data.streak.current++;
    } else {
      this.data.streak.current = 1;
    }
    this.data.streak.lastDate = today;
    this.data.streak.best = Math.max(this.data.streak.best, this.data.streak.current);
  }

  getCategoryWeights() {
    const weights = {};
    const cats = ['deletion', 'change', 'insert', 'navigation', 'yank', 'visual', 'compound'];
    for (const cat of cats) {
      const cs = this.data.categoryStats[cat];
      if (!cs || cs.attempts === 0) {
        weights[cat] = 1.5;
      } else {
        const eff = cs.totalOptimal / Math.max(1, cs.totalKeystrokes);
        weights[cat] = 1 / (eff + 0.1);
      }
    }
    return weights;
  }

  getOverview() {
    const cs = this.data.categoryStats;
    let totalProblems = 0, totalOptimal = 0;
    for (const cat in cs) {
      totalProblems += cs[cat].attempts;
      totalOptimal += cs[cat].optimalCount;
    }
    const recentSessions = this.data.sessions.slice(-7);
    const avgEff = recentSessions.length > 0
      ? recentSessions.reduce((s, ses) => s + (ses.avgEfficiency || 0), 0) / recentSessions.length
      : 0;
    return {
      totalProblems,
      totalOptimal,
      streak: this.data.streak,
      recentEfficiency: avgEff,
      categoryStats: cs,
      sessions: recentSessions
    };
  }
}

// UI RENDERER
// ══════════════════════════════════════════════════════════════

class UIRenderer {
  constructor() {
    this.screens = {
      start: document.getElementById('screen-start'),
      game: document.getElementById('screen-game'),
      feedback: document.getElementById('screen-feedback'),
      results: document.getElementById('screen-results'),
      stats: document.getElementById('screen-stats'),
    };
    this.els = {
      editor: document.getElementById('editor'),
      targetEditor: document.getElementById('target-editor'),
      modeIndicator: document.getElementById('mode-indicator'),
      keystrokeBar: document.getElementById('keystroke-bar'),
      problemDesc: document.getElementById('problem-desc'),
      gameModeLabel: document.getElementById('game-mode-label'),
      gameTimer: document.getElementById('game-timer'),
      gameCounter: document.getElementById('game-counter'),
      commandLine: document.getElementById('command-line'),
      commandText: document.getElementById('command-text'),
      streakDisplay: document.getElementById('streak-display'),
    };
  }

  showScreen(name) {
    for (const key in this.screens) {
      this.screens[key].classList.toggle('active', key === name);
    }
  }

  renderGame(engine, problem, keystrokes, timerText, counterText, modeLabel) {
    this.els.gameModeLabel.textContent = modeLabel;
    this.els.gameTimer.textContent = timerText;
    this.els.gameCounter.textContent = counterText;
    this.els.problemDesc.textContent = problem.description;

    this._renderBuffer(this.els.editor, engine.buffer, engine.cursor, engine.getVisualSelection());
    this._renderTarget(this.els.targetEditor, problem.targetBuffer, engine.buffer);

    const mode = engine.mode;
    this.els.modeIndicator.textContent = mode;
    this.els.modeIndicator.className = '';
    if (mode === 'INSERT') this.els.modeIndicator.classList.add('insert');
    else if (mode === 'VISUAL' || mode === 'VISUAL_LINE') this.els.modeIndicator.classList.add('visual');
    else if (mode === 'COMMAND') this.els.modeIndicator.classList.add('command');

    this._renderKeystrokes(keystrokes);

    if (mode === 'COMMAND') {
      this.els.commandLine.classList.remove('hidden');
      this.els.commandText.textContent = engine.commandBuffer;
    } else {
      this.els.commandLine.classList.add('hidden');
    }
  }

  _renderBuffer(container, buffer, cursor, visualRange) {
    let html = '';
    for (let row = 0; row < buffer.length; row++) {
      const line = buffer[row];
      const lineNum = `<span class="line-num">${String(row + 1).padStart(2)}</span>`;
      let chars = '';

      const highlighted = this._syntaxHighlight(line);

      for (let col = 0; col <= line.length; col++) {
        const ch = col < line.length ? this._escHtml(line[col]) : ' ';
        const cls = [];
        if (cursor && row === cursor.row && col === cursor.col) cls.push('char-cursor');
        if (visualRange && this._isInVisual(row, col, visualRange) && col < line.length) cls.push('char-visual');

        if (cls.length > 0) {
          chars += `<span class="${cls.join(' ')}">${ch}</span>`;
        } else if (col < line.length) {
          chars += highlighted[col] || ch;
        } else if (cursor && row === cursor.row && col === cursor.col) {
          chars += `<span class="char-cursor"> </span>`;
        }
      }

      html += `<span class="editor-line">${lineNum}${chars}</span>\n`;
    }
    container.innerHTML = html;
  }

  _syntaxHighlight(line) {
    const result = {};
    const rules = [
      { re: /\b(function|const|let|var|return|if|else|for|while|class|import|export|from|def|fn|pub|struct|impl|match|async|await|new|true|false|null|None|self|this)\b/g, cls: 'syn-kw' },
      { re: /(["'`])(?:(?!\1|\\).|\\.)*\1/g, cls: 'syn-str' },
      { re: /\/\/.*/g, cls: 'syn-comment' },
      { re: /#.*/g, cls: 'syn-comment' },
      { re: /\b\d+\b/g, cls: 'syn-num' },
    ];

    const used = new Set();
    for (const rule of rules) {
      let m;
      rule.re.lastIndex = 0;
      while ((m = rule.re.exec(line)) !== null) {
        let skip = false;
        for (let i = m.index; i < m.index + m[0].length; i++) {
          if (used.has(i)) { skip = true; break; }
        }
        if (skip) continue;
        for (let i = m.index; i < m.index + m[0].length; i++) {
          used.add(i);
          result[i] = `<span class="${rule.cls}">${this._escHtml(line[i])}</span>`;
        }
      }
    }
    return result;
  }

  _renderTarget(container, targetBuffer, currentBuffer) {
    let html = '';
    const maxLines = Math.max(targetBuffer.length, currentBuffer.length);
    for (let row = 0; row < maxLines; row++) {
      const tLine = row < targetBuffer.length ? targetBuffer[row] : null;
      const cLine = row < currentBuffer.length ? currentBuffer[row] : null;
      const lineNum = `<span class="line-num">${String(row + 1).padStart(2)}</span>`;

      let cls = 'editor-line';
      let displayLine;

      if (tLine === null) {
        cls += ' target-line-removed';
        displayLine = this._escHtml(cLine);
      } else if (cLine === null) {
        cls += ' target-line-added';
        displayLine = this._escHtml(tLine);
      } else if (tLine !== cLine) {
        cls += ' target-line-diff';
        displayLine = this._escHtml(tLine);
      } else {
        displayLine = this._escHtml(tLine);
      }

      html += `<span class="${cls}">${lineNum}${displayLine}</span>\n`;
    }
    container.innerHTML = html;
  }

  _renderKeystrokes(keystrokes) {
    this.els.keystrokeBar.innerHTML = keystrokes
      .map(k => `<span class="key-chip">${this._escHtml(this._keyDisplay(k))}</span>`)
      .join('');
  }

  _keyDisplay(key) {
    switch (key) {
      case 'Escape': return 'Esc';
      case 'Enter': return 'Ret';
      case 'Backspace': return 'Bksp';
      case ' ': return 'Spc';
      case 'Tab': return 'Tab';
      default:
        if (key.startsWith('Alt-')) return `A-${key.slice(4)}`;
        if (key.startsWith('Ctrl-')) return `C-${key.slice(5)}`;
        return key;
    }
  }

  _isInVisual(row, col, range) {
    if (!range) return false;
    if (range.linewise) {
      return row >= range.start.row && row <= range.end.row;
    }
    const pos = row * 100000 + col;
    const start = range.start.row * 100000 + range.start.col;
    const end = range.end.row * 100000 + range.end.col;
    return pos >= start && pos <= end;
  }

  _escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  renderFeedback(problem, userKeys, timeMs) {
    const optimal = problem.optimalKeystrokes;
    const userCount = userKeys.length;
    const optimalCount = optimal.length;
    const efficiency = Math.round((optimalCount / Math.max(1, userCount)) * 100);
    const timeSec = (timeMs / 1000).toFixed(1);

    let badgeCls, badgeText;
    if (userCount <= optimalCount) {
      badgeCls = 'badge-optimal'; badgeText = 'Optimal';
    } else if (userCount <= optimalCount + 2) {
      badgeCls = 'badge-close'; badgeText = 'Close';
    } else {
      badgeCls = 'badge-inefficient'; badgeText = 'Inefficient';
    }

    this.screens.feedback.innerHTML = `
      <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:28px;">
        <div class="feedback-badge ${badgeCls}">${badgeText}</div>
        <div class="feedback-stats">
          <div><span class="feedback-stat-val">${userCount}</span> your keys</div>
          <div><span class="feedback-stat-val">${optimalCount}</span> optimal</div>
          <div><span class="feedback-stat-val">${efficiency}%</span> efficiency</div>
          <div><span class="feedback-stat-val">${timeSec}s</span> time</div>
        </div>
        <div class="feedback-comparison">
          <div class="feedback-col">
            <div class="feedback-col-title">Your keystrokes</div>
            <div class="feedback-keys">${userKeys.map(k => `<span class="key-chip">${this._escHtml(this._keyDisplay(k))}</span>`).join('')}</div>
          </div>
          <div class="feedback-col">
            <div class="feedback-col-title">Optimal solution</div>
            <div class="feedback-keys">${optimal.map(k => `<span class="key-chip" style="color:var(--correct)">${this._escHtml(this._keyDisplay(k))}</span>`).join('')}</div>
          </div>
        </div>
        <div class="feedback-next">press any key to continue</div>
      </div>
    `;
  }

  renderResults(session) {
    const avgEff = Math.round(session.avgEfficiency * 100);
    const avgTime = (session.avgTime / 1000).toFixed(1);
    const optimalPct = Math.round((session.optimalCount / Math.max(1, session.problemsCompleted)) * 100);

    let catHtml = '';
    if (session.categoryBreakdown) {
      for (const [cat, stats] of Object.entries(session.categoryBreakdown)) {
        const eff = Math.round((stats.totalOptimal / Math.max(1, stats.totalKeystrokes)) * 100);
        catHtml += `
          <div class="results-cat-row">
            <span class="results-cat-name">${cat}</span>
            <div class="results-cat-bar-bg"><div class="results-cat-bar-fill" style="width:${eff}%"></div></div>
            <span class="results-cat-pct">${eff}%</span>
          </div>`;
      }
    }

    let worstHtml = '';
    if (session.worstCategory) {
      worstHtml = `<div class="results-worst">Weakest area: <strong>${session.worstCategory}</strong></div>`;
    }

    this.screens.results.innerHTML = `
      <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:32px;">
        <div class="results-title">Session Complete</div>
        <div class="results-grid">
          <div><div class="results-stat-val">${session.problemsCompleted}</div><div class="results-stat-label">Problems</div></div>
          <div><div class="results-stat-val">${avgEff}%</div><div class="results-stat-label">Efficiency</div></div>
          <div><div class="results-stat-val">${avgTime}s</div><div class="results-stat-label">Avg Time</div></div>
          <div><div class="results-stat-val">${optimalPct}%</div><div class="results-stat-label">Optimal</div></div>
          <div><div class="results-stat-val">${session.totalKeystrokes}</div><div class="results-stat-label">Keystrokes</div></div>
          <div><div class="results-stat-val">${session.streak}</div><div class="results-stat-label">Streak</div></div>
        </div>
        ${catHtml ? `<div class="results-categories"><div class="results-cat-title">Category Breakdown</div>${catHtml}</div>` : ''}
        ${worstHtml}
        <button class="btn-primary" id="btn-play-again">Play Again</button>
      </div>
    `;

    document.getElementById('btn-play-again').addEventListener('click', () => {
      this.showScreen('start');
    });
  }

  renderStats(overview) {
    const cs = overview.categoryStats;
    let catHtml = '';
    for (const cat of ['deletion','change','insert','navigation','yank','visual','compound']) {
      const s = cs[cat];
      if (!s || s.attempts === 0) {
        catHtml += `
          <div class="results-cat-row">
            <span class="results-cat-name">${cat}</span>
            <div class="results-cat-bar-bg"><div class="results-cat-bar-fill" style="width:0%"></div></div>
            <span class="results-cat-pct">—</span>
          </div>`;
        continue;
      }
      const eff = Math.round((s.totalOptimal / Math.max(1, s.totalKeystrokes)) * 100);
      const optPct = Math.round((s.optimalCount / Math.max(1, s.attempts)) * 100);
      catHtml += `
        <div class="results-cat-row">
          <span class="results-cat-name">${cat}</span>
          <div class="results-cat-bar-bg"><div class="results-cat-bar-fill" style="width:${eff}%"></div></div>
          <span class="results-cat-pct">${optPct}%</span>
        </div>`;
    }

    this.screens.stats.innerHTML = `
      <div class="fade-in" style="display:flex;flex-direction:column;gap:28px;">
        <div class="stats-header">
          <div class="stats-title">Statistics</div>
          <button class="link-btn" id="btn-stats-back">back</button>
        </div>
        <div class="stats-overview">
          <div><div class="stats-overview-val">${overview.streak.current}</div><div class="stats-overview-label">Day Streak</div></div>
          <div><div class="stats-overview-val">${overview.streak.best}</div><div class="stats-overview-label">Best Streak</div></div>
          <div><div class="stats-overview-val">${overview.totalProblems}</div><div class="stats-overview-label">Total Solved</div></div>
          <div><div class="stats-overview-val">${Math.round(overview.recentEfficiency * 100)}%</div><div class="stats-overview-label">Recent Eff.</div></div>
        </div>
        <div class="stats-mastery">
          <div class="results-cat-title">Category Mastery (% solved optimally)</div>
          ${catHtml}
        </div>
      </div>
    `;

    document.getElementById('btn-stats-back').addEventListener('click', () => {
      this.showScreen('start');
    });
  }

  renderStreak(streak) {
    if (streak.current > 0) {
      this.els.streakDisplay.textContent = `${streak.current} day streak`;
    } else {
      this.els.streakDisplay.textContent = '';
    }
  }
}

// ══════════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════════

class App {
  constructor() {
    this.engine = new VimEngine();
    this.generator = new ProblemGenerator();
    this.renderer = new UIRenderer();
    this.stats = new StatsManager();

    this.state = 'START';
    this.sessionMode = null;
    this.sessionVal = null;
    this.currentProblem = null;
    this.userKeystrokes = [];
    this.problemStartTime = 0;
    this.sessionProblems = [];
    this.timerInterval = null;
    this.timeRemaining = 0;
    this.problemsRemaining = 0;
    this.optimalStreak = 0;

    this._bindEvents();
    this._initStartScreen();
  }

  _bindEvents() {
    document.addEventListener('keydown', (e) => this._onKeyDown(e));

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        const val = btn.dataset.val;
        this._startSession(mode, val);
      });
    });

    document.getElementById('btn-stats').addEventListener('click', () => {
      this.renderer.renderStats(this.stats.getOverview());
      this.renderer.showScreen('stats');
    });

    document.getElementById('btn-quit').addEventListener('click', () => {
      if (this.state === 'PLAYING') this._endSession();
    });
  }

  _initStartScreen() {
    this.renderer.renderStreak(this.stats.data.streak);
    this.renderer.showScreen('start');
  }

  _startSession(mode, val) {
    this.sessionMode = mode;
    this.sessionVal = val;
    this.sessionProblems = [];
    this.optimalStreak = 0;
    this.state = 'PLAYING';

    if (mode === 'timed') {
      this.timeRemaining = parseInt(val, 10);
      this.problemsRemaining = Infinity;
      this._startTimer();
    } else if (mode === 'count') {
      this.problemsRemaining = parseInt(val, 10);
      this.timeRemaining = Infinity;
    } else {
      this.problemsRemaining = Infinity;
      this.timeRemaining = Infinity;
    }

    this._nextProblem();
    this.renderer.showScreen('game');
  }

  _startTimer() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.timeRemaining--;
      this._renderGame();
      if (this.timeRemaining <= 0) {
        clearInterval(this.timerInterval);
        this.timerInterval = null;
        this._endSession();
      }
    }, 1000);
  }

  _nextProblem() {
    let problem;
    if (this.sessionMode === 'practice') {
      problem = this.generator.generate(this.sessionVal);
    } else {
      const weights = this.stats.getCategoryWeights();
      problem = this.generator.generateWeighted(weights);
    }

    this.currentProblem = problem;
    this.userKeystrokes = [];
    this.problemStartTime = Date.now();
    this.engine.loadBuffer(problem.initialBuffer.map(l => l), { ...problem.cursorPos });
    this._renderGame();
  }

  _onKeyDown(e) {
    if (this.state === 'START' || this.state === 'STATS') return;

    if (this.state === 'FEEDBACK') {
      e.preventDefault();
      this.state = 'PLAYING';
      if (this.problemsRemaining <= 0) {
        this._endSession();
      } else {
        this._nextProblem();
        this.renderer.showScreen('game');
      }
      return;
    }

    if (this.state === 'RESULTS') return;
    if (this.state !== 'PLAYING') return;

    e.preventDefault();

    const key = this._normalizeKey(e);
    if (!key) return;

    this.userKeystrokes.push(key);
    this.engine.processKey(key);
    this._renderGame();
    this._checkCompletion();
  }

  _normalizeKey(e) {
    if (e.altKey && e.key === 'j') return 'Alt-j';
    if (e.altKey && e.key === 'k') return 'Alt-k';
    if (e.ctrlKey && e.key === 'v') return 'Ctrl-v';
    if (e.key === 'Escape') return 'Escape';
    if (e.key === 'Enter') return 'Enter';
    if (e.key === 'Backspace') return 'Backspace';
    if (e.key === 'Tab') return 'Tab';
    if (e.key === ' ') return ' ';
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) return e.key;
    return null;
  }

  _checkCompletion() {
    const target = this.currentProblem.targetBuffer;
    const current = this.engine.buffer;

    const bufferMatch = current.length === target.length &&
      current.every((line, i) => line === target[i]);

    if (this.currentProblem.targetCursorPos) {
      const cursorMatch = this.engine.cursor.row === this.currentProblem.targetCursorPos.row &&
        this.engine.cursor.col === this.currentProblem.targetCursorPos.col;
      if (!bufferMatch || !cursorMatch) return;
    } else {
      if (!bufferMatch) return;
    }

    if (this.engine.mode !== 'NORMAL') return;

    const timeMs = Date.now() - this.problemStartTime;
    const optimal = this.currentProblem.optimalKeystrokes;
    const isOptimal = this.userKeystrokes.length <= optimal.length;

    if (isOptimal) this.optimalStreak++;
    else this.optimalStreak = 0;

    const result = {
      category: this.currentProblem.category,
      difficulty: this.currentProblem.difficulty,
      keystrokes: this.userKeystrokes.length,
      optimal: optimal.length,
      time: timeMs,
      isOptimal
    };

    this.sessionProblems.push(result);
    this.stats.recordProblem(result);

    if (this.sessionMode === 'count') {
      this.problemsRemaining--;
    }

    if (this.sessionMode === 'timed') {
      const editorEl = document.getElementById('editor');
      editorEl.classList.remove('solved-flash');
      void editorEl.offsetWidth;
      editorEl.classList.add('solved-flash');
      this._nextProblem();
    } else {
      this.state = 'FEEDBACK';
      this.renderer.renderFeedback(this.currentProblem, this.userKeystrokes, timeMs);
      this.renderer.showScreen('feedback');
    }
  }

  _endSession() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
    this.state = 'RESULTS';

    const problems = this.sessionProblems;
    const totalKeystrokes = problems.reduce((s, p) => s + p.keystrokes, 0);
    const totalOptimal = problems.reduce((s, p) => s + p.optimal, 0);
    const avgEfficiency = totalOptimal / Math.max(1, totalKeystrokes);
    const avgTime = problems.length > 0
      ? problems.reduce((s, p) => s + p.time, 0) / problems.length
      : 0;
    const optimalCount = problems.filter(p => p.isOptimal).length;

    const catBreakdown = {};
    for (const p of problems) {
      if (!catBreakdown[p.category]) {
        catBreakdown[p.category] = { totalKeystrokes: 0, totalOptimal: 0, count: 0 };
      }
      catBreakdown[p.category].totalKeystrokes += p.keystrokes;
      catBreakdown[p.category].totalOptimal += p.optimal;
      catBreakdown[p.category].count++;
    }

    let worstCategory = null, worstEff = Infinity;
    for (const [cat, s] of Object.entries(catBreakdown)) {
      const eff = s.totalOptimal / Math.max(1, s.totalKeystrokes);
      if (eff < worstEff) { worstEff = eff; worstCategory = cat; }
    }

    const session = {
      date: new Date().toISOString(),
      mode: `${this.sessionMode}-${this.sessionVal}`,
      problemsCompleted: problems.length,
      totalKeystrokes,
      totalOptimal,
      avgEfficiency,
      avgTime,
      optimalCount,
      streak: this.optimalStreak,
      categoryBreakdown: catBreakdown,
      worstCategory
    };

    this.stats.endSession(session);
    this.renderer.renderResults(session);
    this.renderer.showScreen('results');
  }

  _renderGame() {
    if (this.state !== 'PLAYING') return;

    const timerText = this.sessionMode === 'timed' ? `${this.timeRemaining}s` : '';
    const counterText = this.sessionMode === 'count'
      ? `${this.sessionProblems.length + 1} / ${this.sessionProblems.length + this.problemsRemaining}`
      : `#${this.sessionProblems.length + 1}`;

    const modeLabel = this.sessionMode === 'practice'
      ? `Practice: ${this.sessionVal}`
      : `${this.sessionMode} ${this.sessionVal}${this.sessionMode === 'timed' ? 's' : ''}`;

    this.renderer.renderGame(
      this.engine, this.currentProblem, this.userKeystrokes,
      timerText, counterText, modeLabel
    );
  }
}

// ══════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════

const app = new App();
</script>
