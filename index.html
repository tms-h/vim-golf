<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vim Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a2e;
  --surface: #1f1f38;
  --text: #e0def4;
  --muted: #908caa;
  --faint: #6e6a86;
  --accent: #c4a7e7;
  --correct: #9ccfd8;
  --warn: #f6c177;
  --incorrect: #eb6f92;
  --cursor-bg: #e0def4;
  --cursor-fg: #1a1a2e;
  --line-num: #3e3a56;
  --visual: rgba(196, 167, 231, 0.22);
  --font-serif: 'Crimson Pro', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--font-serif); font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
#app { height: 100vh; display: flex; flex-direction: column; }
.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* ── Terminal Start ───────────────────── */
#screen-start { align-items: center; justify-content: center; gap: 0; font-family: var(--font-mono); }
.term-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 480px; width: 100%; }
.term-logo { text-align: center; }
.term-logo h1 { font-family: var(--font-mono); font-weight: 700; font-size: 2.2rem; letter-spacing: .12em; color: var(--text); }
.term-logo .term-tagline { font-family: var(--font-serif); font-size: .9rem; color: var(--muted); font-style: italic; font-weight: 300; margin-top: 2px; }
.term-menu { display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 320px; }
.term-item {
  display: flex; align-items: center; gap: 10px; padding: 5px 16px;
  font-size: .82rem; color: var(--muted); cursor: pointer; transition: color .1s, background .1s;
  border-left: 2px solid transparent;
}
.term-item:hover { color: var(--text); background: rgba(196,167,231,0.06); border-left-color: var(--faint); }
.term-key { color: var(--accent); min-width: 22px; text-align: center; font-size: .72rem; }
.term-label { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; padding: 8px 16px 2px; }
.term-sub { padding-left: 38px; }
.term-back { font-size: .68rem; color: var(--faint); padding: 4px 16px; margin-top: 2px; }
.term-tip { font-size: .7rem; color: var(--faint); font-style: italic; text-align: center; max-width: 360px; line-height: 1.5; }
.term-footer { display: flex; gap: 24px; align-items: center; justify-content: center; }
.streak-display { font-family: var(--font-mono); font-size: .72rem; color: var(--faint); }

/* ── Help Overlay ─────────────────────── */
#help-overlay {
  position: fixed; inset: 0; background: rgba(26,26,46,0.92); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); animation: fadeIn .15s ease-out;
}
#help-overlay.hidden { display: none; }
.help-box { max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px 32px; }
.help-title { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; letter-spacing: .05em; }
.help-section { margin-bottom: 16px; }
.help-heading { font-size: .7rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; border-bottom: 1px solid var(--surface); padding-bottom: 4px; }
.help-row { display: flex; gap: 12px; font-size: .75rem; color: var(--muted); padding: 2px 0; }
.help-row .hk { color: var(--accent); min-width: 60px; text-align: right; }
.help-close { font-size: .68rem; color: var(--faint); text-align: center; margin-top: 12px; }

/* ── Game ──────────────────────────────── */
#screen-game { padding: 8px 20px; gap: 4px; position: relative; }
#game-header {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .8rem; color: var(--muted); min-height: 28px; flex-shrink: 0;
}
#game-info { display: flex; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: .8rem; color: var(--faint); }
#problem-desc { font-size: .95rem; color: var(--text); line-height: 1.4; flex-shrink: 0; min-height: 22px; }
.editor-container { flex: 1; display: flex; gap: 2px; min-height: 0; overflow: hidden; }
.editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.editor-label { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; padding: 2px 0; flex-shrink: 0; }
.editor-divider { width: 1px; background: var(--surface); flex-shrink: 0; margin: 16px 6px; }
.editor {
  flex: 1; overflow: auto; font-family: var(--font-mono); font-size: .78rem;
  line-height: 1.65; white-space: pre; padding: 4px 0;
}
.editor-line { display: block; padding: 0 8px 0 0; }
.line-num { display: inline-block; width: 2.5ch; text-align: right; color: var(--line-num); margin-right: 1ch; user-select: none; font-size: .72rem; }
.char-cursor { background: var(--cursor-bg); color: var(--cursor-fg); }
.char-visual { background: var(--visual); }
.char-target-cursor { outline: 2px solid var(--accent); outline-offset: -1px; }
.syn-kw { color: #c4a7e7; } .syn-str { color: #f6c177; }
.syn-comment { color: var(--faint); font-style: italic; } .syn-num { color: #9ccfd8; }
.syn-type { color: #9ccfd8; } .syn-func { color: #eb6f92; }
.syn-op { color: #e0def4; font-weight: bold; } .syn-preproc { color: #c4a7e7; font-style: italic; }
.syn-bool { color: #eb6f92; } .syn-ns { color: #9ccfd8; }
.replay-overlay { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; padding: 12px; background: rgba(25, 23, 36, 0.95); border-top: 1px solid var(--border); }
.replay-bar { font-family: var(--font); font-size: 14px; color: var(--text); margin-bottom: 6px; }
.replay-key { color: var(--accent); } .replay-key-current { color: var(--correct); font-weight: bold; }
.replay-counter { color: var(--faint); margin-left: 8px; }
.replay-hint { font-size: 12px; color: var(--faint); }
.target-editor { opacity: .5; }
.target-line-diff { border-left: 2px solid var(--accent); padding-left: 4px; opacity: 1; }

/* ── Status & Hints ────────────────────── */
#status-bar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 24px; }
#mode-indicator {
  font-family: var(--font-mono); font-size: .65rem; font-weight: 700;
  letter-spacing: .06em; padding: 1px 8px; color: var(--bg); background: var(--accent); text-transform: uppercase;
}
#mode-indicator.insert { background: var(--correct); }
#mode-indicator.visual { background: var(--warn); }
#mode-indicator.command { background: var(--muted); }
#keystroke-bar { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; align-items: center; }
.key-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; padding: 0 4px; background: var(--surface);
  font-family: var(--font-mono); font-size: .65rem; color: var(--muted);
}
#mode-hints {
  font-family: var(--font-mono); font-size: .6rem; color: var(--faint);
  flex-shrink: 0; min-height: 16px; letter-spacing: .02em; opacity: .7;
}

/* ── Command Overlay ───────────────────── */
#command-overlay {
  position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, 50%);
  background: var(--surface); border: 1px solid var(--faint);
  padding: 10px 28px; font-family: var(--font-mono); font-size: 1rem;
  color: var(--text); z-index: 100; min-width: 320px; text-align: center;
}
#command-overlay .cmd-prefix { color: var(--accent); margin-right: 2px; }
#command-overlay .cmd-cursor { color: var(--accent); animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── Inline Feedback ───────────────────── */
#inline-feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--bg); border: 1px solid var(--surface);
  padding: 20px 40px; z-index: 90; text-align: center;
  animation: feedIn .2s ease-out;
}
@keyframes feedIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.95); } }
.feed-badge { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
.feed-badge.optimal { color: var(--correct); }
.feed-badge.close { color: var(--warn); }
.feed-badge.inefficient { color: var(--incorrect); }
.feed-stats { display: flex; gap: 24px; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); justify-content: center; margin-bottom: 10px; }
.feed-stat-val { font-size: 1.1rem; color: var(--text); font-weight: 500; display: block; }
.feed-keys { display: flex; gap: 20px; justify-content: center; }
.feed-keys-col { text-align: center; }
.feed-keys-label { font-size: .65rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; font-family: var(--font-serif); }
.feed-keys-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.feed-auto { font-size: .7rem; color: var(--faint); font-style: italic; margin-top: 8px; font-family: var(--font-serif); }

/* ── Results ───────────────────────────── */
#screen-results { align-items: center; justify-content: center; gap: 24px; overflow-y: auto; padding: 24px; }
.results-title { font-weight: 300; font-size: 1.8rem; }
.results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; width: 100%; max-width: 480px; }
.results-stat-label { font-size: .7rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.results-stat-val { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 500; }
.results-categories { width: 100%; max-width: 480px; }
.results-cat-title { font-size: .72rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.results-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.results-cat-name { font-size: .78rem; color: var(--muted); width: 80px; text-align: right; }
.results-cat-bar-bg { flex: 1; height: 5px; background: var(--surface); }
.results-cat-bar-fill { height: 100%; background: var(--accent); transition: width .4s; }
.results-cat-pct { font-family: var(--font-mono); font-size: .68rem; color: var(--faint); width: 36px; }
.results-worst { font-size: .85rem; color: var(--muted); font-style: italic; text-align: center; }
.results-worst strong { color: var(--warn); font-weight: 500; }
.results-actions { display: flex; gap: 16px; }
.results-hints { font-family: var(--font-mono); font-size: .65rem; color: var(--faint); text-align: center; }
.btn-primary {
  background: none; border: 1px solid var(--faint); font-family: var(--font-serif);
  font-size: .85rem; color: var(--text); padding: 6px 24px; cursor: pointer; transition: border-color .15s;
}
.btn-primary:hover { border-color: var(--accent); color: var(--accent); }

/* ── Stats ─────────────────────────────── */
#screen-stats { padding: 24px; gap: 16px; overflow-y: auto; }
.stats-header { display: flex; justify-content: space-between; align-items: baseline; }
.stats-title { font-weight: 300; font-size: 1.6rem; }
.stats-section { margin-bottom: 8px; }
.stats-section-title { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
.stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
.stats-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; text-align: center; }
.stat-block { padding: 8px 4px; }
.stat-val { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 500; }
.stat-label { font-size: .6rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.stat-val-sm { font-family: var(--font-mono); font-size: .85rem; font-weight: 500; }
.stats-graph { width: 100%; max-width: 520px; }
.stats-graph svg { width: 100%; height: auto; }
.stats-bests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: .72rem; }
.stats-best-cell { background: var(--surface); padding: 8px; text-align: center; }
.stats-best-cell .sbc-mode { color: var(--muted); font-family: var(--font-mono); font-size: .65rem; margin-bottom: 4px; }
.stats-best-cell .sbc-val { font-family: var(--font-mono); color: var(--text); font-size: .9rem; }
.stats-best-cell .sbc-date { color: var(--faint); font-size: .58rem; margin-top: 2px; }
.stats-best-cell.empty .sbc-val { color: var(--faint); }
.stats-heatmap { }
.stats-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: .72rem; }
.stats-cat-name { color: var(--muted); width: 80px; text-align: right; font-family: var(--font-mono); }
.stats-cat-bar { flex: 1; height: 6px; background: var(--surface); }
.stats-cat-fill { height: 100%; background: var(--accent); }
.stats-cat-pct { font-family: var(--font-mono); color: var(--faint); width: 32px; font-size: .65rem; }
.stats-cat-meta { font-family: var(--font-mono); color: var(--faint); width: 80px; font-size: .58rem; text-align: right; }
.stats-sessions-table { font-size: .7rem; width: 100%; }
.stats-sessions-table .st-header { display: flex; color: var(--faint); font-family: var(--font-mono); font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; padding: 4px 0; border-bottom: 1px solid var(--surface); }
.stats-sessions-table .st-row { display: flex; color: var(--muted); font-family: var(--font-mono); padding: 3px 0; border-bottom: 1px solid rgba(31,31,56,0.5); }
.stats-sessions-table .st-row:nth-child(even) { background: rgba(31,31,56,0.3); }
.stats-sessions-table .st-cell { flex: 1; text-align: center; }
.stats-sessions-table .st-cell:first-child { text-align: left; }
.stats-hints { font-family: var(--font-mono); font-size: .62rem; color: var(--faint); }
.no-data { color: var(--faint); font-style: italic; font-size: .8rem; }
.link-btn {
  background: none; border: none; font-family: var(--font-serif); font-size: .85rem;
  color: var(--faint); cursor: pointer; font-style: italic; transition: color .15s;
}
.link-btn:hover { color: var(--muted); }

.target-line-added { border-left: 2px solid var(--correct); padding-left: 4px; opacity: 1; }
.search-match { background: rgba(246, 193, 119, 0.3); }
.sub-old { background: rgba(235, 111, 146, 0.3); text-decoration: line-through; text-decoration-color: #eb6f92; }
.sub-new { background: rgba(156, 207, 216, 0.3); color: #9ccfd8; }
.font-size-controls { position: fixed; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 50; }
.font-size-btn { background: var(--surface); border: 1px solid var(--faint); color: var(--muted); font-family: var(--font-mono); font-size: .7rem; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
.font-size-btn:hover { color: var(--accent); border-color: var(--accent); }
.difficulty-badge { font-family: var(--font-mono); font-size: .65rem; color: var(--faint); }
.difficulty-badge .d-active { color: var(--warn); }
.hidden { display: none !important; }
.fade-in { animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <div class="font-size-controls">
    <button class="font-size-btn" id="btn-font-down" title="Decrease font size (Ctrl--)">−</button>
    <button class="font-size-btn" id="btn-font-up" title="Increase font size (Ctrl-+)">+</button>
  </div>
  <div id="screen-start" class="screen active">
    <div class="term-wrap">
      <div class="term-logo">
        <h1>vim golf</h1>
        <div class="term-tagline">train your keystrokes</div>
      </div>
      <div class="term-menu" id="term-menu"></div>
      <div class="term-tip" id="term-tip"></div>
      <div class="term-footer">
        <span class="streak-display" id="streak-display"></span>
      </div>
    </div>
    <div id="help-overlay" class="hidden"></div>
  </div>

  <div id="screen-game" class="screen">
    <div id="game-header">
      <span id="game-mode-label"></span>
      <span id="game-info">
        <span id="game-difficulty" class="difficulty-badge"></span>
        <span id="game-timer"></span>
        <span id="game-counter"></span>
        <button class="link-btn" id="btn-quit">end</button>
      </span>
    </div>
    <p id="problem-desc"></p>
    <div class="editor-container">
      <div class="editor-pane">
        <div class="editor-label">Buffer</div>
        <div class="editor" id="editor"></div>
      </div>
      <div class="editor-divider"></div>
      <div class="editor-pane">
        <div class="editor-label">Target</div>
        <div class="editor target-editor" id="target-editor"></div>
      </div>
    </div>
    <div id="status-bar">
      <span id="mode-indicator">NORMAL</span>
      <div id="keystroke-bar"></div>
    </div>
    <div id="mode-hints"></div>
    <div id="command-overlay" class="hidden">
      <span class="cmd-prefix">:</span><span id="command-text"></span><span class="cmd-cursor">_</span>
    </div>
    <div id="inline-feedback" class="hidden"></div>
  </div>

  <div id="screen-results" class="screen"></div>
  <div id="screen-stats" class="screen"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// VIM ENGINE
// ══════════════════════════════════════════════════════════════

class VimEngine {
  constructor() { this._init(); }

  _init() {
    this.buffer = [''];
    this.cursor = { row: 0, col: 0 };
    this.mode = 'NORMAL';
    this.register = '';
    this.registerLinewise = false;
    this.pending = { count: '', operator: null, textObjType: null, awaitingChar: null, g: false, namedReg: null };
    this.visualAnchor = null;
    this.lastFind = null;
    this.commandBuffer = '';
    this._dotKeys = [];
    this._lastDot = [];
    this._dotActive = false;
    this._dotDirty = false;
    this._replayDepth = 0;
    this._insertJPending = false;
    this._undoStack = [];
    this._redoStack = [];
    this._undoCheckpoint = null;
    this.macroRecording = null;
    this.macroBuffer = [];
    this.macroRegisters = {};
    this.lastMacroReg = null;
    this.searchPattern = '';
    this.searchDirection = 1;
    this._searchMode = false;
    this.marks = {};
    this.namedRegisters = {};
    this._vbPending = null;
  }

  loadBuffer(lines, cursor) {
    this._init();
    this.buffer = lines.map(l => l);
    this.cursor = { row: cursor.row, col: cursor.col };
    this._clampCursor();
  }

  processKey(key) {
    if (this.macroRecording && this._replayDepth === 0) {
      this.macroBuffer.push(key);
    }

    if (this._replayDepth === 0) {
      if (this.mode === 'NORMAL' && !this._dotActive &&
          this.pending.count === '' && !this.pending.operator &&
          !this.pending.awaitingChar && !this.pending.g && !this.pending.textObjType) {
        this._dotKeys = [];
        this._dotActive = true;
        this._dotDirty = false;
        this._undoCheckpoint = { buffer: this.buffer.map(l => l), cursor: { ...this.cursor } };
      }
      if (this._dotActive) this._dotKeys.push(key);
    }

    switch (this.mode) {
      case 'NORMAL': this._handleNormal(key); break;
      case 'INSERT': this._handleInsert(key); break;
      case 'REPLACE': this._handleReplace(key); break;
      case 'VISUAL': case 'VISUAL_LINE': case 'VISUAL_BLOCK': this._handleVisual(key); break;
      case 'COMMAND': this._handleCommand(key); break;
    }

    if (this._replayDepth === 0 && this._dotActive && this.mode === 'NORMAL' &&
        this.pending.count === '' && !this.pending.operator &&
        !this.pending.awaitingChar && !this.pending.g && !this.pending.textObjType) {
      if (this._dotDirty) this._lastDot = [...this._dotKeys];
      this._dotActive = false;
      this._undoCheckpoint = null;
    }

    if (this._insertOneShotArmed && this.mode === 'NORMAL') {
      this._insertOneShotArmed = false;
      this._insertOneShot = true;
    } else if (this._insertOneShot && this.mode === 'NORMAL' &&
        this.pending.count === '' && !this.pending.operator &&
        !this.pending.awaitingChar && !this.pending.g) {
      this._insertOneShot = false;
      this.mode = 'INSERT';
    }
  }

  _markDirty() {
    this._dotDirty = true;
    this._redoStack = [];
    if (this._undoCheckpoint) {
      this._undoStack.push(this._undoCheckpoint);
      this._undoCheckpoint = null;
      if (this._undoStack.length > 100) this._undoStack.shift();
    }
  }

  _undo() {
    if (this._undoStack.length === 0) return;
    this._redoStack.push({ buffer: this.buffer.map(l => l), cursor: { ...this.cursor } });
    const s = this._undoStack.pop();
    this.buffer = s.buffer;
    this.cursor = s.cursor;
    this._clampCursor();
  }

  _redo() {
    if (this._redoStack.length === 0) return;
    this._undoStack.push({ buffer: this.buffer.map(l => l), cursor: { ...this.cursor } });
    const s = this._redoStack.pop();
    this.buffer = s.buffer;
    this.cursor = s.cursor;
    this._clampCursor();
  }

  _charClass(ch) {
    if (!ch || /\s/.test(ch)) return 'space';
    if (/[a-zA-Z0-9_]/.test(ch)) return 'word';
    return 'punct';
  }

  _firstNonBlank(row) {
    const m = (this.buffer[row] || '').match(/\S/);
    return m ? (this.buffer[row] || '').indexOf(m[0]) : 0;
  }

  _clampCursor() {
    this.cursor.row = Math.max(0, Math.min(this.cursor.row, this.buffer.length - 1));
    const len = this.buffer[this.cursor.row].length;
    this.cursor.col = this.mode === 'INSERT'
      ? Math.max(0, Math.min(this.cursor.col, len))
      : Math.max(0, Math.min(this.cursor.col, Math.max(0, len - 1)));
  }

  _getCount() {
    const c = parseInt(this.pending.count, 10);
    return (isNaN(c) || c < 1) ? 1 : c;
  }

  _clearPending() {
    this.pending = { count: '', operator: null, textObjType: null, awaitingChar: null, g: false, namedReg: null };
  }

  // ── Normal Mode ─────────────────────────────────────────
  _handleNormal(key) {
    if (this.pending.awaitingChar) { this._resolveAwaitingChar(key); return; }
    if (this.pending.textObjType) { this._resolveTextObject(key); return; }

    if (this.macroRecording && key === 'q' && !this.pending.operator && !this.pending.g && !this.pending.textObjType) {
      this.macroRegisters[this.macroRecording] = this.macroBuffer.slice(0, -1);
      this.macroRecording = null;
      this.macroBuffer = [];
      this._clearPending();
      return;
    }

    if (this.pending.g) {
      this.pending.g = false;
      if (key === 'g') {
        const count = this._getCount();
        this.cursor.row = this.pending.count !== '' ? Math.min(count - 1, this.buffer.length - 1) : 0;
        this.cursor.col = this._firstNonBlank(this.cursor.row);
        this._clampCursor(); this._clearPending(); return;
      }
      if (key === '~') {
        const line = this.buffer[this.cursor.row];
        let swapped = '';
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          swapped += ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase();
        }
        this.buffer[this.cursor.row] = swapped;
        this._markDirty(); this._clearPending(); return;
      }
      if (key === 'U' || key === 'u') {
        this.pending.operator = key === 'U' ? 'gU' : 'gu';
        return;
      }
      if (key === 'c') {
        this.pending.operator = 'gc';
        return;
      }
      this._clearPending(); return;
    }

    if ((key >= '1' && key <= '9') || (key === '0' && this.pending.count.length > 0)) {
      this.pending.count += key; return;
    }

    if (this.pending.operator === 'gc' && key === 'c') {
      this._toggleCommentLines(this.cursor.row, this.cursor.row + this._getCount() - 1);
      this._clearPending(); return;
    }

    if ('dcy><'.includes(key)) {
      if (this.pending.operator === key) {
        this._operateOnLines(key, this._getCount()); this._clearPending(); return;
      }
      if (this.pending.operator) { this._clearPending(); return; }
      this.pending.operator = key; return;
    }

    if (this.pending.operator && (key === 'i' || key === 'a')) {
      this.pending.textObjType = key; return;
    }
    if ('fFtT'.includes(key)) { this.pending.awaitingChar = key; return; }
    if (key === 'r') { this.pending.awaitingChar = 'r'; return; }
    if (key === 'g') { this.pending.g = true; return; }
    if (key === 'q') { this.pending.awaitingChar = 'q_rec'; return; }
    if (key === '@') { this.pending.awaitingChar = '@_play'; return; }
    if (key === 'm') { this.pending.awaitingChar = 'm_set'; return; }
    if (key === "'") { this.pending.awaitingChar = "'_jump"; return; }
    if (key === '`') { this.pending.awaitingChar = '`_jump'; return; }
    if (key === '"') { this.pending.awaitingChar = '"_reg'; return; }
    if (key === '/') { this.mode = 'COMMAND'; this.commandBuffer = ''; this._searchMode = true; this._searchForward = true; return; }
    if (key === '?') { this.mode = 'COMMAND'; this.commandBuffer = ''; this._searchMode = true; this._searchForward = false; return; }

    const motion = this._tryMotion(key);
    if (motion) {
      if (this.pending.operator) {
        this._applyOperator(this.pending.operator, this._motionToRange(motion));
        if (this.pending.namedReg && (this.pending.operator === 'd' || this.pending.operator === 'c' || this.pending.operator === 'y')) {
          this.namedRegisters[this.pending.namedReg] = { text: this.register, linewise: this.registerLinewise };
        }
      } else {
        this.cursor = { row: motion.row, col: motion.col };
        this._clampCursor();
      }
      this._clearPending(); return;
    }
    this._handleSimpleCommand(key);
    this._clearPending();
  }

  // ── Insert Mode ─────────────────────────────────────────
  _handleInsert(key) {
    if (key === 'Escape') { this._exitInsert(); return; }
    if (key === 'Ctrl-o') { this._insertOneShotArmed = true; this.mode = 'NORMAL'; return; }

    if (this._insertJPending) {
      this._insertJPending = false;
      if (key === 'k') {
        const line = this.buffer[this.cursor.row];
        this.buffer[this.cursor.row] = line.slice(0, this.cursor.col - 1) + line.slice(this.cursor.col);
        this.cursor.col--;
        if (this._vbPending && this._vbPending.text.length > 0) {
          this._vbPending.text = this._vbPending.text.slice(0, -1);
        }
        this._exitInsert(); return;
      }
    }

    if (key === 'Alt-j') { this._moveLineDown(); this._markDirty(); return; }
    if (key === 'Alt-k') { this._moveLineUp(); this._markDirty(); return; }

    if (key === 'Backspace') {
      if (this.cursor.col > 0) {
        const l = this.buffer[this.cursor.row];
        this.buffer[this.cursor.row] = l.slice(0, this.cursor.col - 1) + l.slice(this.cursor.col);
        this.cursor.col--; this._markDirty();
        if (this._vbPending && this._vbPending.text.length > 0) {
          this._vbPending.text = this._vbPending.text.slice(0, -1);
        }
      } else if (this.cursor.row > 0) {
        const prev = this.buffer[this.cursor.row - 1].length;
        this.buffer[this.cursor.row - 1] += this.buffer[this.cursor.row];
        this.buffer.splice(this.cursor.row, 1);
        this.cursor.row--; this.cursor.col = prev; this._markDirty();
      }
      return;
    }

    if (key === 'Enter') {
      const l = this.buffer[this.cursor.row];
      this.buffer[this.cursor.row] = l.slice(0, this.cursor.col);
      this.buffer.splice(this.cursor.row + 1, 0, l.slice(this.cursor.col));
      this.cursor.row++; this.cursor.col = 0; this._markDirty(); return;
    }

    if (key === 'Tab') {
      const l = this.buffer[this.cursor.row];
      this.buffer[this.cursor.row] = l.slice(0, this.cursor.col) + '  ' + l.slice(this.cursor.col);
      this.cursor.col += 2; this._markDirty(); return;
    }

    if (key.length === 1) {
      const l = this.buffer[this.cursor.row];
      this.buffer[this.cursor.row] = l.slice(0, this.cursor.col) + key + l.slice(this.cursor.col);
      this.cursor.col++; this._markDirty();
      if (key === 'j') this._insertJPending = true;
      if (this._vbPending) this._vbPending.text += key;
    }
  }

  _exitInsert() {
    this.mode = 'NORMAL'; this._insertJPending = false;
    if (this._vbPending) {
      const vb = this._vbPending;
      this._vbPending = null;
      if (vb.text) {
        for (let r = vb.startRow + 1; r <= Math.min(vb.endRow, this.buffer.length - 1); r++) {
          const line = this.buffer[r];
          if (vb.type === 'I') {
            const col = Math.min(vb.startCol, line.length);
            this.buffer[r] = line.slice(0, col) + vb.text + line.slice(col);
          } else {
            this.buffer[r] = line + vb.text;
          }
        }
      }
      this._markDirty();
    }
    if (this.cursor.col > 0) this.cursor.col--;
    this._clampCursor();
  }

  // ── Replace Mode ────────────────────────────────────────
  _handleReplace(key) {
    if (key === 'Escape') { this.mode = 'NORMAL'; if (this.cursor.col > 0) this.cursor.col--; this._clampCursor(); return; }
    if (key === 'Backspace') { if (this.cursor.col > 0) this.cursor.col--; return; }
    if (key.length === 1) {
      const l = this.buffer[this.cursor.row];
      if (this.cursor.col < l.length) {
        this.buffer[this.cursor.row] = l.slice(0, this.cursor.col) + key + l.slice(this.cursor.col + 1);
      } else {
        this.buffer[this.cursor.row] = l + key;
      }
      this.cursor.col++;
      this._markDirty();
    }
  }

  // ── Visual Mode ─────────────────────────────────────────
  _handleVisual(key) {
    if (key === 'Escape' || (key === 'v' && this.mode === 'VISUAL') || (key === 'V' && this.mode === 'VISUAL_LINE') || (key === 'Ctrl-v' && this.mode === 'VISUAL_BLOCK')) {
      this.mode = 'NORMAL'; this.visualAnchor = null; this._clearPending(); return;
    }
    if (key === 'v') { this.mode = 'VISUAL'; return; }
    if (key === 'V') { this.mode = 'VISUAL_LINE'; return; }
    if (key === 'Ctrl-v') { this.mode = 'VISUAL_BLOCK'; return; }

    if (this.mode === 'VISUAL_BLOCK' && (key === 'I' || key === 'A')) {
      const range = this._getVisualBlockRange();
      if (range) {
        this._vbPending = { type: key, startRow: range.startRow, endRow: range.endRow, startCol: range.startCol, endCol: range.endCol, text: '' };
        if (key === 'I') {
          this.cursor = { row: range.startRow, col: range.startCol };
        } else {
          this.cursor = { row: range.startRow, col: this.buffer[range.startRow].length };
        }
        this._clampCursor();
        this.mode = 'INSERT';
        this.visualAnchor = null;
        this._markDirty();
      }
      return;
    }

    if (key === 'U' || key === 'u') {
      const range = this.mode === 'VISUAL_BLOCK' ? this._getVisualBlockRange() : this._getVisualRange();
      if (range) this._caseRange(range, key === 'U');
      this.mode = 'NORMAL'; this.visualAnchor = null; this._clearPending(); return;
    }

    if (this.pending.g) {
      this.pending.g = false;
      if (key === 'c') {
        const range = this.mode === 'VISUAL_BLOCK' ? this._getVisualBlockRange() : this._getVisualRange();
        if (range) this._toggleCommentLines(range.start?.row ?? range.startRow, range.end?.row ?? range.endRow);
        this.mode = 'NORMAL'; this.visualAnchor = null; this._clearPending(); return;
      }
      this._clearPending(); return;
    }
    if (key === 'g') { this.pending.g = true; return; }

    if ('dcy><'.includes(key)) {
      if (this.mode === 'VISUAL_BLOCK') {
        const range = this._getVisualBlockRange();
        if (range) this._applyBlockOperator(key, range);
      } else {
        const range = this._getVisualRange();
        if (range) this._applyOperator(key, range);
      }
      if (key === '>' || key === '<') return;
      if (key !== 'c') { this.mode = 'NORMAL'; this.visualAnchor = null; }
      this._clearPending(); return;
    }

    if (key === 'o' && this.visualAnchor) {
      const tmp = { ...this.cursor }; this.cursor = { ...this.visualAnchor }; this.visualAnchor = tmp; return;
    }
    if (key === 'Alt-j') { this._moveLineDown(); this._markDirty(); return; }
    if (key === 'Alt-k') { this._moveLineUp(); this._markDirty(); return; }

    const motion = this._tryMotion(key);
    if (motion) { this.cursor = { row: motion.row, col: motion.col }; this._clampCursor(); }
  }

  _getVisualRange() {
    if (!this.visualAnchor) return null;
    const a = this.visualAnchor, c = this.cursor;
    if (this.mode === 'VISUAL_LINE') {
      const s = Math.min(a.row, c.row), e = Math.max(a.row, c.row);
      return { start: { row: s, col: 0 }, end: { row: e, col: this.buffer[e].length }, linewise: true, inclusive: true };
    }
    const [start, end] = (a.row < c.row || (a.row === c.row && a.col <= c.col)) ? [{ ...a }, { ...c }] : [{ ...c }, { ...a }];
    return { start, end, linewise: false, inclusive: true };
  }

  _getVisualBlockRange() {
    if (!this.visualAnchor) return null;
    const a = this.visualAnchor, c = this.cursor;
    return { startRow: Math.min(a.row, c.row), endRow: Math.max(a.row, c.row), startCol: Math.min(a.col, c.col), endCol: Math.max(a.col, c.col), blockwise: true };
  }

  getVisualSelection() {
    if (this.mode === 'VISUAL_BLOCK') return this._getVisualBlockRange();
    if (this.mode !== 'VISUAL' && this.mode !== 'VISUAL_LINE') return null;
    return this._getVisualRange();
  }

  // ── Command Mode ────────────────────────────────────────
  _handleCommand(key) {
    if (key === 'Escape') { this.mode = 'NORMAL'; this.commandBuffer = ''; this._searchMode = false; return; }
    if (key === 'Enter') {
      if (this._searchMode) this._executeSearch(this.commandBuffer);
      else this._executeCommand(this.commandBuffer);
      this.mode = 'NORMAL'; this.commandBuffer = ''; this._searchMode = false; return;
    }
    if (key === 'Backspace') {
      if (this.commandBuffer.length > 0) this.commandBuffer = this.commandBuffer.slice(0, -1);
      else { this.mode = 'NORMAL'; this._searchMode = false; }
      return;
    }
    if (key.length === 1) this.commandBuffer += key;
  }

  _executeCommand(cmd) {
    const rangeM = cmd.match(/^(%|(\d+),(\d+))s\/((?:[^\\\/]|\\.)*)\\?\/((?:[^\\\/]|\\.)*)(?:\/(g?))?$/);
    if (rangeM) {
      const search = rangeM[4], replace = rangeM[5], global = rangeM[6] === 'g';
      let startR, endR;
      if (rangeM[1] === '%') { startR = 0; endR = this.buffer.length - 1; }
      else { startR = Math.max(0, parseInt(rangeM[2], 10) - 1); endR = Math.min(this.buffer.length - 1, parseInt(rangeM[3], 10) - 1); }
      for (let r = startR; r <= endR; r++) this.buffer[r] = this._subLine(this.buffer[r], search, replace, global);
      this._markDirty(); this._clampCursor(); return;
    }
    const m = cmd.match(/^s\/((?:[^\\\/]|\\.)*)\\?\/((?:[^\\\/]|\\.)*)(?:\/(g?))?$/);
    if (m) {
      this.buffer[this.cursor.row] = this._subLine(this.buffer[this.cursor.row], m[1], m[2], m[3] === 'g');
      this._markDirty();
    } else {
      const lineNum = parseInt(cmd, 10);
      if (!isNaN(lineNum)) {
        this.cursor.row = Math.max(0, Math.min(lineNum - 1, this.buffer.length - 1));
        this.cursor.col = this._firstNonBlank(this.cursor.row);
      }
    }
    this._clampCursor();
  }

  _subLine(line, search, replace, global) {
    const sr = search.replace(/\\([/])/g, '$1'), rp = replace.replace(/\\([/])/g, '$1');
    try {
      const re = new RegExp(sr, global ? 'g' : '');
      return line.replace(re, rp);
    } catch {
      if (global) return line.split(sr).join(rp);
      const idx = line.indexOf(sr);
      if (idx !== -1) return line.slice(0, idx) + rp + line.slice(idx + sr.length);
      return line;
    }
  }

  _executeSearch(pattern) {
    if (!pattern) return;
    this.searchPattern = pattern;
    this.searchDirection = this._searchForward !== false ? 1 : -1;
    this._jumpToNextMatch(1);
  }

  _getSearchMatches() {
    if (!this.searchPattern) return [];
    let re;
    try { re = new RegExp(this.searchPattern, 'g'); } catch { try { re = new RegExp(this.searchPattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'); } catch { return []; } }
    const matches = [];
    for (let r = 0; r < this.buffer.length; r++) {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(this.buffer[r])) !== null) {
        matches.push({ row: r, col: m.index });
        if (m[0].length === 0) { re.lastIndex++; if (re.lastIndex > this.buffer[r].length) break; }
      }
    }
    return matches;
  }

  _motionSearch(dir) {
    const matches = this._getSearchMatches();
    if (!matches.length) return null;
    const d = dir * this.searchDirection;
    const curPos = this.cursor.row * 100000 + this.cursor.col;
    if (d > 0) {
      const m = matches.find(m => m.row * 100000 + m.col > curPos);
      const t = m || matches[0];
      return { row: t.row, col: t.col, linewise: false, inclusive: false };
    }
    const rev = [...matches].reverse();
    const m = rev.find(m => m.row * 100000 + m.col < curPos);
    const t = m || matches[matches.length - 1];
    return { row: t.row, col: t.col, linewise: false, inclusive: false };
  }

  _jumpToNextMatch(dir) {
    const m = this._motionSearch(dir);
    if (m) { this.cursor = { row: m.row, col: m.col }; this._clampCursor(); }
    return m;
  }

  // ── Motions ─────────────────────────────────────────────
  _tryMotion(key) {
    const n = this._getCount();
    switch (key) {
      case 'h': return { row: this.cursor.row, col: Math.max(0, this.cursor.col - n), linewise: false, inclusive: false };
      case 'l': return { row: this.cursor.row, col: Math.min(Math.max(0, this.buffer[this.cursor.row].length - 1), this.cursor.col + n), linewise: false, inclusive: false };
      case 'j': return { row: Math.min(this.buffer.length - 1, this.cursor.row + n), col: this.cursor.col, linewise: true, inclusive: false };
      case 'k': return { row: Math.max(0, this.cursor.row - n), col: this.cursor.col, linewise: true, inclusive: false };
      case 'w': return this._motionW(n);
      case 'b': return this._motionB(n);
      case 'e': return this._motionE(n);
      case 'W': return this._motionBigW(n);
      case 'B': return this._motionBigB(n);
      case 'E': return this._motionBigE(n);
      case '0': return { row: this.cursor.row, col: 0, linewise: false, inclusive: false };
      case '^': return { row: this.cursor.row, col: this._firstNonBlank(this.cursor.row), linewise: false, inclusive: false };
      case '_': { const r = Math.min(this.buffer.length - 1, this.cursor.row + n - 1); return { row: r, col: this._firstNonBlank(r), linewise: true, inclusive: false }; }
      case '+': case 'Enter': { const r = Math.min(this.buffer.length - 1, this.cursor.row + n); return { row: r, col: this._firstNonBlank(r), linewise: true, inclusive: false }; }
      case '-': { const r = Math.max(0, this.cursor.row - n); return { row: r, col: this._firstNonBlank(r), linewise: true, inclusive: false }; }
      case '$': { const r = Math.min(this.buffer.length - 1, this.cursor.row + n - 1); return { row: r, col: Math.max(0, this.buffer[r].length - 1), linewise: false, inclusive: true }; }
      case '{': return this._motionPara(-1, n);
      case '}': return this._motionPara(1, n);
      case 'G': return this._motionG(n);
      case '%': return this._motionPercent();
      case 'H': return { row: 0, col: this._firstNonBlank(0), linewise: true, inclusive: false };
      case 'M': { const mid = Math.floor((this.buffer.length - 1) / 2); return { row: mid, col: this._firstNonBlank(mid), linewise: true, inclusive: false }; }
      case 'L': { const last = this.buffer.length - 1; return { row: last, col: this._firstNonBlank(last), linewise: true, inclusive: false }; }
      case ',': return this._repeatFind(true);
      case 'n': return this._motionSearch(1);
      case 'N': return this._motionSearch(-1);
    }
    return null;
  }

  _motionW(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      let line = this.buffer[row];
      if (col < line.length) { const cls = this._charClass(line[col]); if (cls !== 'space') while (col < line.length && this._charClass(line[col]) === cls) col++; }
      while (true) { line = this.buffer[row]; while (col < line.length && this._charClass(line[col]) === 'space') col++; if (col < line.length || row >= this.buffer.length - 1) break; row++; col = 0; }
    }
    return { row, col, linewise: false, inclusive: false };
  }

  _motionB(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      col--;
      while (true) { if (col < 0) { if (row <= 0) { col = 0; break; } row--; col = this.buffer[row].length - 1; continue; } if (this._charClass(this.buffer[row][col]) !== 'space') break; col--; }
      if (col >= 0) { const cls = this._charClass(this.buffer[row][col]); while (col > 0 && this._charClass(this.buffer[row][col - 1]) === cls) col--; }
      col = Math.max(0, col);
    }
    return { row, col, linewise: false, inclusive: false };
  }

  _motionE(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      col++;
      while (true) { const line = this.buffer[row]; if (col >= line.length) { if (row >= this.buffer.length - 1) { col = Math.max(0, line.length - 1); break; } row++; col = 0; continue; } if (this._charClass(line[col]) !== 'space') break; col++; }
      const line = this.buffer[row]; if (col < line.length) { const cls = this._charClass(line[col]); while (col < line.length - 1 && this._charClass(line[col + 1]) === cls) col++; }
    }
    return { row, col, linewise: false, inclusive: true };
  }

  _motionBigW(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      let line = this.buffer[row]; while (col < line.length && this._charClass(line[col]) !== 'space') col++;
      while (true) { line = this.buffer[row]; while (col < line.length && this._charClass(line[col]) === 'space') col++; if (col < line.length || row >= this.buffer.length - 1) break; row++; col = 0; }
    }
    return { row, col, linewise: false, inclusive: false };
  }

  _motionBigB(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      col--;
      while (true) { if (col < 0) { if (row <= 0) { col = 0; break; } row--; col = this.buffer[row].length - 1; continue; } if (this._charClass(this.buffer[row][col]) !== 'space') break; col--; }
      if (col >= 0) while (col > 0 && this._charClass(this.buffer[row][col - 1]) !== 'space') col--;
      col = Math.max(0, col);
    }
    return { row, col, linewise: false, inclusive: false };
  }

  _motionBigE(n) {
    let row = this.cursor.row, col = this.cursor.col;
    for (let i = 0; i < n; i++) {
      col++;
      while (true) { const line = this.buffer[row]; if (col >= line.length) { if (row >= this.buffer.length - 1) { col = Math.max(0, line.length - 1); break; } row++; col = 0; continue; } if (this._charClass(line[col]) !== 'space') break; col++; }
      const line = this.buffer[row]; if (col < line.length) while (col < line.length - 1 && this._charClass(line[col + 1]) !== 'space') col++;
    }
    return { row, col, linewise: false, inclusive: true };
  }

  _motionG(n) {
    if (this.pending.count !== '') { const r = Math.max(0, Math.min(n - 1, this.buffer.length - 1)); return { row: r, col: this._firstNonBlank(r), linewise: true, inclusive: false }; }

  _motionPara(dir, n) {

    for (let i = 0; i < n; i++) { row += dir; while (row > 0 && row < this.buffer.length - 1 && this.buffer[row].trim() !== '') row += dir; }
    row = Math.max(0, Math.min(row, this.buffer.length - 1));

  _motionPercent() {
    const line = this.buffer[this.cursor.row];
    const pairs = { '(': ')', ')': '(', '{': '}', '}': '{', '[': ']', ']': '[' };
    let ch = line[this.cursor.col], col = this.cursor.col;

    else { c--; while (row >= 0) { const l = this.buffer[row]; while (c >= 0) { if (l[c] === ch) depth++; else if (l[c] === match) depth--; if (depth === 0) return { row, col: c, linewise: false, inclusive: true }; c--; } row--; if (row >= 0) c = this.buffer[row].length - 1; } }

  _resolveAwaitingChar(key) {

    if (type === 'm_set') { if (/[a-z]/.test(key)) this.marks[key] = { row: this.cursor.row, col: this.cursor.col }; this._clearPending(); return; }

  _findChar(type, ch, n) {

  _repeatFind(reverse) {

  // ── Text Objects ────────────────────────────────────────
  _resolveTextObject(key) {

    const range = this._getTextObjRange(type, key);

        this.namedRegisters[this.pending.namedReg] = { text: this.register, linewise: this.registerLinewise };

  }

  _getTextObjRange(type, key) {
    const a = type === 'a';
    switch (key) {
      case 'w': return this._textObjWord(a);
      case '"': return this._textObjQuote('"', a);
      case "'": return this._textObjQuote("'", a);
      case '`': return this._textObjQuote('`', a);
      case '(': case ')': case 'b': return this._textObjBracket('(', ')', a);
      case '{': case '}': case 'B': return this._textObjBracket('{', '}', a);
      case '[': case ']': return this._textObjBracket('[', ']', a);

    return null;
  }

  _textObjWord(around) {
    const line = this.buffer[this.cursor.row], col = this.cursor.col;
    if (!line.length) return null;
    const cls = this._charClass(line[col]);
    let start = col, end = col;
    if (cls === 'space') { while (start > 0 && this._charClass(line[start - 1]) === 'space') start--; while (end < line.length - 1 && this._charClass(line[end + 1]) === 'space') end++; }
    else {
      while (start > 0 && this._charClass(line[start - 1]) === cls) start--;
      while (end < line.length - 1 && this._charClass(line[end + 1]) === cls) end++;
      if (around) {
        if (end < line.length - 1 && this._charClass(line[end + 1]) === 'space') { while (end < line.length - 1 && this._charClass(line[end + 1]) === 'space') end++; }

  }

  _textObjQuote(q, around) {
    const line = this.buffer[this.cursor.row];
    const positions = [];
    for (let i = 0; i < line.length; i++) if (line[i] === q && (i === 0 || line[i - 1] !== '\\')) positions.push(i);

    for (let i = 0; i < positions.length - 1; i += 2) {

  _textObjBracket(open, close, around) {
    let foundOpen = false, sr = this.cursor.row, sc = this.cursor.col;

    if (!foundOpen) return null;
    let er = sr, ec = sc, depth = 0, foundClose = false;
    for (let r = sr; r < this.buffer.length; r++) {
      const line = this.buffer[r]; const startC = r === sr ? sc : 0;

      }
      if (foundClose) break;
    }
    if (!foundClose) return null;
    if (around) return { start: { row: sr, col: sc }, end: { row: er, col: ec }, linewise: false, inclusive: true };
    let sRow = sr, sCol = sc + 1, eRow = er, eCol = ec - 1;

    if (eCol < 0 && eRow > sRow) { eRow--; eCol = Math.max(0, this.buffer[eRow].length - 1); }
    if (sRow > eRow || (sRow === eRow && sCol > eCol)) return { start: { row: sr, col: sc + 1 }, end: { row: sr, col: sc }, linewise: false, inclusive: true, empty: true };
    return { start: { row: sRow, col: sCol }, end: { row: eRow, col: eCol }, linewise: false, inclusive: true };
  }

  // ── Operators ───────────────────────────────────────────
  _motionToRange(motion) {
    if (motion.linewise) {
      const s = Math.min(this.cursor.row, motion.row), e = Math.max(this.cursor.row, motion.row);
      return { start: { row: s, col: 0 }, end: { row: e, col: this.buffer[e].length }, linewise: true, inclusive: true };
    }
    const cp = this.cursor.row * 1e5 + this.cursor.col, mp = motion.row * 1e5 + motion.col;

    return { start, end, linewise: false, inclusive: !!motion.inclusive };
  }

  _applyOperator(op, range) {
    switch (op) {
      case 'd': this._deleteRange(range); break;
      case 'c': this._deleteRange(range); this.mode = 'INSERT'; break;
      case 'y': this._yankRange(range); break;
      case '>': this._indentRange(range, 1); break;
      case '<': this._indentRange(range, -1); break;

  }

  _toggleCommentLines(sr, er) {
    sr = Math.max(0, sr); er = Math.min(this.buffer.length - 1, er);
    const allCommented = this.buffer.slice(sr, er + 1).every(l => /^\s*\/\//.test(l));
    for (let r = sr; r <= er; r++) {

      } else {

      }

  }

  _caseRange(range, upper) {
    const fn = upper ? s => s.toUpperCase() : s => s.toLowerCase();
    if (range.linewise) {
      for (let r = range.start.row; r <= range.end.row; r++) this.buffer[r] = fn(this.buffer[r]);
    } else {
      const sr = range.start.row, sc = range.start.col, er = range.end.row;
      const ec = range.inclusive ? range.end.col + 1 : range.end.col;
      if (sr === er) { const l = this.buffer[sr]; this.buffer[sr] = l.slice(0, sc) + fn(l.slice(sc, ec)) + l.slice(ec); }

    }

  }

  _applyBlockOperator(op, range) {
    if (op === 'd' || op === 'c') {
      let deleted = '';

        const line = this.buffer[r];
        const sc = Math.min(range.startCol, line.length), ec = Math.min(range.endCol + 1, line.length);

    } else if (op === 'y') {
      let yanked = '';
      for (let r = range.startRow; r <= Math.min(range.endRow, this.buffer.length - 1); r++) {
        const line = this.buffer[r];
        const sc = Math.min(range.startCol, line.length), ec = Math.min(range.endCol + 1, line.length);
        if (r > range.startRow) yanked += '\n';
        yanked += line.slice(sc, ec);
      }
      this.register = yanked; this.registerLinewise = false;
    } else if (op === '>' || op === '<') {
      this._indentRange({ start: { row: range.startRow }, end: { row: range.endRow } }, op === '>' ? 1 : -1);

  }

  _deleteRange(range) {
    if (range.empty) { this.register = ''; this.registerLinewise = false; this.cursor = { ...range.start }; this._clampCursor(); this._markDirty(); return; }

    } else {
      const sr = range.start.row, sc = range.start.col, er = range.end.row;
      const ec = range.inclusive ? range.end.col + 1 : range.end.col;
      if (sr === er) {

  }

  _yankRange(range) {

  _indentRange(range, dir) {

  }

  _operateOnLines(op, count) {
    const s = this.cursor.row, e = Math.min(s + count - 1, this.buffer.length - 1);

  // ── Simple Commands ─────────────────────────────────────

      case 'A': this.mode = 'INSERT'; this.cursor.col = this.buffer[this.cursor.row].length; return;
      case 'I': this.mode = 'INSERT'; this.cursor.col = this._firstNonBlank(this.cursor.row); return;
      case 'o': this.buffer.splice(this.cursor.row + 1, 0, ''); this.cursor.row++; this.cursor.col = 0; this.mode = 'INSERT'; this._markDirty(); return;
      case 'O': this.buffer.splice(this.cursor.row, 0, ''); this.cursor.col = 0; this.mode = 'INSERT'; this._markDirty(); return;
      case 'p': this._pasteAfter(); return;
      case 'P': this._pasteBefore(); return;
      case 'v': this.mode = 'VISUAL'; this.visualAnchor = { ...this.cursor }; return;
      case 'V': this.mode = 'VISUAL_LINE'; this.visualAnchor = { ...this.cursor }; return;
      case 'Ctrl-v': this.mode = 'VISUAL_BLOCK'; this.visualAnchor = { ...this.cursor }; return;
      case '.': this._dotRepeat(); return;
      case 'u': this._undo(); return;
      case 'Ctrl-r': this._redo(); return;
      case 'R': this.mode = 'REPLACE'; this._markDirty(); return;
      case ';': case ':': this.mode = 'COMMAND'; this.commandBuffer = ''; this._searchMode = false; return;
      case 's': { const l = this.buffer[this.cursor.row]; if (l.length && this.cursor.col < l.length) { this.register = l[this.cursor.col]; this.registerLinewise = false; this.buffer[this.cursor.row] = l.slice(0, this.cursor.col) + l.slice(this.cursor.col + 1); this._markDirty(); } this.mode = 'INSERT'; return; }
      case 'S': { const indent = this.buffer[this.cursor.row].match(/^(\s*)/)[1]; this.register = this.buffer[this.cursor.row]; this.registerLinewise = true; this.buffer[this.cursor.row] = indent; this.cursor.col = indent.length; this.mode = 'INSERT'; this._markDirty(); return; }
      case '~': { const l = this.buffer[this.cursor.row]; if (this.cursor.col < l.length) { const ch = l[this.cursor.col]; const t = ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase(); this.buffer[this.cursor.row] = l.slice(0, this.cursor.col) + t + l.slice(this.cursor.col + 1); this.cursor.col = Math.min(this.cursor.col + 1, Math.max(0, this.buffer[this.cursor.row].length - 1)); this._markDirty(); } return; }

      case 'Y': { this.register = this.buffer.slice(this.cursor.row, this.cursor.row + count).join('\n'); this.registerLinewise = true; return; }

      case 'Ctrl-x': this._incrementNumber(-count); return;
      case '*': this._searchWordUnderCursor(); return;
      case 'Alt-j': for (let i = 0; i < count; i++) this._moveLineDown(); this._markDirty(); return;
      case 'Alt-k': for (let i = 0; i < count; i++) this._moveLineUp(); this._markDirty(); return;
    }
  }

  _replaceChar(ch) {
    const l = this.buffer[this.cursor.row], n = this._getCount();
    if (this.cursor.col < l.length) {
      let s = l; for (let i = 0; i < n && this.cursor.col + i < s.length; i++) s = s.slice(0, this.cursor.col + i) + ch + s.slice(this.cursor.col + i + 1);
      this.buffer[this.cursor.row] = s;
      this.cursor.col = Math.min(this.cursor.col + n - 1, s.length - 1);
      this._markDirty();
    }
  }

  _pasteAfter() {
    let text = this.register, lw = this.registerLinewise;
    if (this.pending.namedReg) {
      const nr = this.namedRegisters[this.pending.namedReg];
      if (nr) { text = nr.text; lw = nr.linewise; }
    }
    if (!text) return;
    if (lw) {
      this.buffer.splice(this.cursor.row + 1, 0, ...text.split('\n'));

// STATS MANAGER
// ══════════════════════════════════════════════════════════════

class StatsManager {
  constructor() { this.data = this._load(); }

  _load() {
    try {
      const d = JSON.parse(localStorage.getItem('vim-golf:data'));
      if (d?.version >= 1) {
        if (!d.testsStarted) d.testsStarted = d.sessions?.length || 0;
        if (!d.testsCompleted) d.testsCompleted = d.sessions?.length || 0;
        if (!d.totalTypingTime) d.totalTypingTime = 0;
        if (!d.totalKeystrokesAllTime) d.totalKeystrokesAllTime = 0;
        if (!d.activityCalendar) d.activityCalendar = {};
        d.version = 2;
        return d;
      }
    } catch {}
    return { version: 2, sessions: [], categoryStats: {}, streak: { current: 0, best: 0, lastDate: null }, bests: {}, testsStarted: 0, testsCompleted: 0, totalTypingTime: 0, totalKeystrokesAllTime: 0, activityCalendar: {} };
  }

  save() { try { localStorage.setItem('vim-golf:data', JSON.stringify(this.data)); } catch {} }

  recordSessionStart() {
    this.data.testsStarted++;
    this.save();
  }

  recordProblem(r) {
    const cs = this.data.categoryStats[r.category] ??= { attempts: 0, optimalCount: 0, totalKeystrokes: 0, totalOptimal: 0, totalTime: 0 };
    cs.attempts++; cs.totalKeystrokes += r.keystrokes; cs.totalOptimal += r.optimal;
    cs.totalTime = (cs.totalTime || 0) + (r.time || 0);
    if (r.keystrokes <= r.optimal) cs.optimalCount++;
  }

  recordCommand(key) {
    if (!this.data.commandFrequency) this.data.commandFrequency = {};
    this.data.commandFrequency[key] = (this.data.commandFrequency[key] || 0) + 1;
  }

  exportData() { return JSON.stringify(this.data, null, 2); }

  importData(json) {
    try {
      const d = JSON.parse(json);
      if (d?.version) { this.data = d; this.save(); return true; }
    } catch {}
    return false;
  }

  resetData() {
    this.data = { version: 2, sessions: [], categoryStats: {}, streak: { current: 0, best: 0, lastDate: null }, bests: {}, testsStarted: 0, testsCompleted: 0, totalTypingTime: 0, totalKeystrokesAllTime: 0, activityCalendar: {}, commandFrequency: {} };
    this.save();
  }

  endSession(session) {
    this.data.testsCompleted++;
    this.data.sessions.push(session);
    if (this.data.sessions.length > 200) this.data.sessions = this.data.sessions.slice(-200);

    this.data.totalTypingTime += session.totalTime || 0;
    this.data.totalKeystrokesAllTime += session.totalKeystrokes || 0;

    const today = new Date().toISOString().slice(0, 10);
    this.data.activityCalendar[today] = (this.data.activityCalendar[today] || 0) + session.problemsCompleted;

    const last = this.data.streak.lastDate;
    if (last !== today) {
      const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      this.data.streak.current = last === yesterday ? this.data.streak.current + 1 : 1;
      this.data.streak.lastDate = today;
      this.data.streak.best = Math.max(this.data.streak.best, this.data.streak.current);
    }
    const key = session.mode;
    const prev = this.data.bests[key];
    if (!prev || session.avgEfficiency > prev.avgEfficiency) this.data.bests[key] = { avgEfficiency: session.avgEfficiency, problemsCompleted: session.problemsCompleted, date: session.date };
    this.save();
  }

  getCategoryWeights() {
    const w = {};
    for (const cat of ['deletion','change','insert','navigation','yank','visual','compound','macro','search','marks','registers']) {
      const cs = this.data.categoryStats[cat];
      w[cat] = (!cs || cs.attempts === 0) ? 1.5 : 1 / ((cs.totalOptimal / Math.max(1, cs.totalKeystrokes)) + .1);
    }
    return w;
  }

  getOverview() {
    const cs = this.data.categoryStats;
    let tp = 0, to = 0, tk = 0, topt = 0;
    for (const cat in cs) { tp += cs[cat].attempts; to += cs[cat].optimalCount; tk += cs[cat].totalKeystrokes; topt += cs[cat].totalOptimal; }
    const recent = this.data.sessions.slice(-50);
    const recent10 = this.data.sessions.slice(-10);
    const avgEffAll = tk > 0 ? topt / tk : 0;
    const avgEff10 = recent10.length ? recent10.reduce((s, x) => s + (x.avgEfficiency || 0), 0) / recent10.length : 0;
    let weightedTimeSum = 0;
    for (const s of this.data.sessions) weightedTimeSum += (s.avgTime || 0) * (s.problemsCompleted || 0);
    const avgTimeAll = tp > 0 ? weightedTimeSum / tp : 0;
    const avgTime10 = recent10.length ? recent10.reduce((s, x) => s + (x.avgTime || 0), 0) / recent10.length : 0;
    let bestEff = 0, bestAvgTime = Infinity;
    for (const s of this.data.sessions) {
      if ((s.avgEfficiency || 0) > bestEff) bestEff = s.avgEfficiency;
      if (s.avgTime > 0 && s.avgTime < bestAvgTime) bestAvgTime = s.avgTime;
    }
    if (bestAvgTime === Infinity) bestAvgTime = 0;
    return {
      totalProblems: tp, totalOptimal: to, streak: this.data.streak,
      recentSessions: recent, categoryStats: cs, bests: this.data.bests,
      testsStarted: this.data.testsStarted, testsCompleted: this.data.testsCompleted,
      totalTypingTime: this.data.totalTypingTime, totalKeystrokesAllTime: this.data.totalKeystrokesAllTime,
      avgEffAll, avgEff10, avgTimeAll, avgTime10, bestEff, bestAvgTime,
      avgKeystrokesPerProblem: tp > 0 ? tk / tp : 0,
      activityCalendar: this.data.activityCalendar,
      commandFrequency: this.data.commandFrequency || {}
    };
  }
}

const VIM_TIPS = [

  '% jumps between matching brackets',
  'f{char} finds the next occurrence on the line',
  '. repeats your last change — the most powerful vim command',
  'Ctrl-v enters visual block mode for column editing',
  'J joins lines — no need to navigate to the end',
  '* searches for the word under the cursor',
  'qa records a macro to register a, q stops, @a replays',
  'diw deletes a word without the space, daw includes it',
  ':s/old/new/g replaces all occurrences on a line',
  'cc changes an entire line, preserving indent',
  '0 goes to column 0, ^ goes to first non-blank',

class UIRenderer {

  // ── Start Screen ────────────────────────────────────────

  }

  renderHelp(visible) {
    const overlay = this.el('help-overlay');
    if (!visible) { overlay.classList.add('hidden'); return; }
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<div class="help-box">
      <div class="help-title">Keybindings</div>
      <div class="help-section">
        <div class="help-heading">Start Screen</div>
        <div class="help-row"><span class="hk">t</span> timed mode</div>
        <div class="help-row"><span class="hk">c</span> count mode</div>
        <div class="help-row"><span class="hk">p</span> practice mode</div>
        <div class="help-row"><span class="hk">s</span> statistics</div>
        <div class="help-row"><span class="hk">1 2 3</span> select sub-option</div>
        <div class="help-row"><span class="hk">Esc</span> back from submenu</div>
        <div class="help-row"><span class="hk">?</span> toggle this help</div>
      </div>
      <div class="help-section">
        <div class="help-heading">Game</div>
        <div class="help-row"><span class="hk">Tab</span> skip problem</div>
        <div class="help-row"><span class="hk">Ctrl-g</span> show solution replay</div>
